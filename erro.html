<style>

  :root{--bg:#0a0a0a;--card:#111;--line:#1e1e1e;--coral:#FF5A1F;--red:#ef4444;--ink:#fff;--ink-3:#888;--r:14px;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px;}
  .wrap{max-width:500px;width:100%;text-align:center;}
  .icon-wrap{width:80px;height:80px;border-radius:50%;background:rgba(239,68,68,.12);border:2px solid rgba(239,68,68,.3);display:flex;align-items:center;justify-content:center;margin:0 auto 28px;animation:pop .5s cubic-bezier(.34,1.56,.64,1);}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .icon-wrap svg{width:36px;height:36px;color:var(--red);}
  h1{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;margin-bottom:8px;}
  .subtitle{color:var(--ink-3);font-size:15px;line-height:1.6;margin-bottom:32px;}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:32px;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:99px;font-size:14px;font-weight:700;text-decoration:none;transition:opacity .2s;}
  .btn-primary{background:var(--coral);color:#fff;}
  .btn-secondary{background:transparent;color:var(--ink);border:1px solid #333;}
  .btn:hover{opacity:.8;}
  .contact-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;}
  .contact-title{font-size:13px;color:var(--ink-3);margin-bottom:12px;}
  .contacts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .contact-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;transition:border-color .2s;}
  .contact-btn:hover{border-color:var(--coral);}
  .logo{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--coral);margin-bottom:36px;letter-spacing:-.02em;}
</style>
